<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tscript AI · Precise Instrument for Text</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2300c8e0'/%3E%3Ccircle cx='32' cy='32' r='22' fill='none' stroke='%23ffffff' stroke-width='4'/%3E%3Cpath d='M22 33l7 7 13-14' fill='none' stroke='%23ffffff' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
/* ---------- themes ---------- */
:root {
  --radius-lg: 18px;
  --radius-md: 12px;
  --radius-sm: 8px;
  --shadow-1: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.08);
  --shadow-2: 0 1px 3px rgba(0,0,0,.08), 0 24px 64px rgba(0,0,0,.16);
  --transition: 200ms cubic-bezier(.2,.7,.2,1);
  --font: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
}
[data-theme="dark"] {
  --bg: #0b1219;
  --bg-elev: #111a23;
  --bg-soft: #16212c;
  --fg: #eaf2f8;
  --fg-muted: #93a3b3;
  --border: #1d2c39;
  --accent: #00c8e0;
  --accent-2: #7c5cff;
  --success: #2bd97f;
  --warn: #f5b54a;
  --error: #ff6b6b;
  --panel-grad: linear-gradient(180deg, #111a23, #0b1219);
}
[data-theme="light"] {
  --bg: #f6f8fb;
  --bg-elev: #ffffff;
  --bg-soft: #eef2f7;
  --fg: #0c1722;
  --fg-muted: #5b6b7c;
  --border: #d8e1ec;
  --accent: #0070f3;
  --accent-2: #6b46ff;
  --success: #10b981;
  --warn: #d97706;
  --error: #dc2626;
  --panel-grad: linear-gradient(180deg, #ffffff, #f6f8fb);
}
[data-theme="pinkwhite"] {
  --bg: linear-gradient(135deg, #ffeaf3 0%, #ffffff 50%, #fff0f6 100%);
  --bg-elev: rgba(255,255,255,.85);
  --bg-soft: rgba(255,228,240,.55);
  --fg: #3a1f33;
  --fg-muted: #8a5a76;
  --border: #f4c7dc;
  --accent: #ec4899;
  --accent-2: #f472b6;
  --success: #16a34a;
  --warn: #d97706;
  --error: #dc2626;
  --panel-grad: linear-gradient(180deg, rgba(255,255,255,.92), rgba(255,230,243,.7));
}
[data-theme="midnight"] {
  --bg: #050810;
  --bg-elev: #0c111b;
  --bg-soft: #111827;
  --fg: #e2e8f0;
  --fg-muted: #94a3b8;
  --border: #1f2937;
  --accent: #38bdf8;
  --accent-2: #a78bfa;
  --success: #22c55e;
  --warn: #f59e0b;
  --error: #f87171;
  --panel-grad: linear-gradient(180deg, #0c111b, #050810);
}
[data-theme="sepia"] {
  --bg: #f4ecd8;
  --bg-elev: #fbf6e9;
  --bg-soft: #ece1c2;
  --fg: #2f2418;
  --fg-muted: #6b5a45;
  --border: #d6c79d;
  --accent: #8b5a2b;
  --accent-2: #b07a3f;
  --success: #4f7d3a;
  --warn: #b6791f;
  --error: #b13a2a;
  --panel-grad: linear-gradient(180deg, #fbf6e9, #f4ecd8);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--fg);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
}
button { font-family: inherit; cursor: pointer; }
a { color: var(--accent); text-decoration: none; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; }
::-webkit-scrollbar-thumb:hover { background: var(--fg-muted); }

/* ---------- layout ---------- */
.app {
  display: grid;
  grid-template-columns: 260px 1fr;
  min-height: 100vh;
}
.sidebar {
  background: var(--bg-elev);
  border-right: 1px solid var(--border);
  padding: 22px 16px;
  position: sticky; top: 0; height: 100vh;
  display: flex; flex-direction: column; gap: 6px;
}
.brand {
  display: flex; align-items: center; gap: 10px;
  font-weight: 800; font-size: 18px; letter-spacing: -.01em;
  padding: 4px 8px 18px 8px;
}
.brand .dot {
  width: 28px; height: 28px; border-radius: 9px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  display: grid; place-items: center; color: #fff; font-weight: 800;
  box-shadow: var(--shadow-1);
}
.nav-btn {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 12px;
  border-radius: var(--radius-md);
  color: var(--fg-muted);
  background: transparent; border: 1px solid transparent;
  font-weight: 500; font-size: 14px;
  transition: var(--transition);
}
.nav-btn:hover { background: var(--bg-soft); color: var(--fg); }
.nav-btn.active {
  background: var(--bg-soft);
  color: var(--fg);
  border-color: var(--border);
}
.nav-btn i { width: 18px; }
.nav-section {
  font-size: 11px; text-transform: uppercase; letter-spacing: .12em;
  color: var(--fg-muted);
  padding: 14px 12px 6px 12px;
}
.sidebar .footer {
  margin-top: auto;
  padding: 10px 12px;
  font-size: 12px; color: var(--fg-muted);
  border-top: 1px solid var(--border);
}
.main { padding: 22px 28px 60px 28px; min-width: 0; }
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; padding: 6px 0 22px 0;
}
.topbar .crumbs { color: var(--fg-muted); font-size: 13px; }
.topbar .actions { display: flex; align-items: center; gap: 10px; }
.user-chip {
  display: flex; align-items: center; gap: 10px;
  padding: 6px 10px 6px 6px; border-radius: 999px;
  background: var(--bg-soft); border: 1px solid var(--border);
}
.user-chip img { width: 26px; height: 26px; border-radius: 999px; object-fit: cover; }
.user-chip .name { font-weight: 600; font-size: 13px; }

.card {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 18px 20px;
  box-shadow: var(--shadow-1);
}
.card h3 { margin: 0 0 6px 0; font-size: 15px; font-weight: 700; }
.card p { margin: 0; color: var(--fg-muted); font-size: 13px; line-height: 1.55; }

.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 10px 14px;
  font-size: 13px; font-weight: 600;
  border-radius: 10px;
  background: var(--bg-soft);
  color: var(--fg);
  border: 1px solid var(--border);
  transition: var(--transition);
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: #fff; border-color: transparent;
}
.btn.primary:hover { transform: translateY(-1px); box-shadow: var(--shadow-2); color: #fff; }
.btn.ghost { background: transparent; }
.btn.icon { padding: 8px; border-radius: 10px; }

input, textarea, select {
  font: inherit;
  width: 100%;
  background: var(--bg);
  color: var(--fg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 11px 13px;
  outline: none;
  transition: var(--transition);
}
input:focus, textarea:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }

.tag {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: 999px;
  background: var(--bg-soft); border: 1px solid var(--border);
  font-size: 11px; font-weight: 600; color: var(--fg-muted);
}

/* ---------- home ---------- */
.hero {
  position: relative;
  padding: 72px 28px 56px 28px;
  background:
    radial-gradient(900px 480px at 80% -10%, color-mix(in srgb, var(--accent) 28%, transparent), transparent 60%),
    radial-gradient(700px 360px at -10% 30%, color-mix(in srgb, var(--accent-2) 28%, transparent), transparent 60%);
  border-radius: 28px;
  overflow: hidden;
  margin-bottom: 26px;
}
.hero h1 {
  font-size: clamp(36px, 5vw, 56px);
  letter-spacing: -.02em; line-height: 1.05; margin: 0 0 14px 0;
  background: linear-gradient(135deg, var(--fg), var(--accent));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.hero p.lede { font-size: 17px; max-width: 720px; color: var(--fg-muted); line-height: 1.6; }
.hero .cta { display: flex; gap: 12px; margin-top: 24px; flex-wrap: wrap; }
.floating-shape {
  position: absolute; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  opacity: .12; filter: blur(40px);
  animation: floaty 12s ease-in-out infinite;
}
.floating-shape.s1 { width: 220px; height: 220px; right: -60px; top: -40px; animation-delay: 0s; }
.floating-shape.s2 { width: 160px; height: 160px; left: -40px; bottom: -50px; animation-delay: 4s; }
@keyframes floaty {
  0%,100% { transform: translate3d(0,0,0) scale(1); }
  50% { transform: translate3d(20px,30px,0) scale(1.05); }
}

.feature-grid {
  display: grid; gap: 16px;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
}
.feature {
  position: relative; padding: 22px;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  transition: var(--transition);
  overflow: hidden;
}
.feature:hover { transform: translateY(-3px); box-shadow: var(--shadow-2); border-color: color-mix(in srgb, var(--accent) 60%, var(--border)); }
.feature .ico {
  width: 42px; height: 42px; border-radius: 12px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  display: grid; place-items: center; color: #fff;
  margin-bottom: 14px;
  box-shadow: 0 8px 24px color-mix(in srgb, var(--accent) 35%, transparent);
}
.feature h4 { margin: 0 0 4px 0; font-size: 16px; }
.feature p { margin: 0; color: var(--fg-muted); font-size: 13px; line-height: 1.55; }

.section-title { display: flex; align-items: baseline; gap: 12px; margin: 8px 0 16px 0; }
.section-title h2 { margin: 0; font-size: 22px; letter-spacing: -.01em; }
.section-title p { color: var(--fg-muted); font-size: 13px; }

/* ---------- chat ---------- */
.chat-shell { display: grid; grid-template-rows: auto 1fr auto; height: calc(100vh - 130px); gap: 14px; }
.messages {
  overflow-y: auto; padding: 18px;
  background: var(--bg-elev); border: 1px solid var(--border);
  border-radius: var(--radius-lg);
}
.bubble {
  max-width: 760px; padding: 14px 16px; border-radius: 14px;
  margin: 8px 0; line-height: 1.6; font-size: 14.5px;
  white-space: pre-wrap; word-wrap: break-word;
  border: 1px solid var(--border);
  animation: pop .25s ease;
}
@keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.bubble.user { background: color-mix(in srgb, var(--accent) 14%, var(--bg-soft)); margin-left: auto; border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); }
.bubble.assistant { background: var(--bg-soft); }
.bubble .meta { display: flex; gap: 10px; margin-top: 8px; }
.bubble.actions button { background: none; border: 1px solid var(--border); border-radius: 8px; padding: 4px 8px; font-size: 11px; color: var(--fg-muted); }
.bubble .images { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; margin-top: 10px; }
.bubble .images img { width: 100%; height: 140px; object-fit: cover; border-radius: 10px; border: 1px solid var(--border); }
.composer {
  display: grid; grid-template-columns: 1fr auto; gap: 10px;
  background: var(--bg-elev); padding: 12px; border: 1px solid var(--border); border-radius: var(--radius-lg);
}
.composer textarea { min-height: 56px; max-height: 220px; resize: vertical; }
.composer .row { display: flex; align-items: center; gap: 8px; padding: 6px 10px; }
.toggle {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 6px 10px; border-radius: 999px;
  background: var(--bg-soft); border: 1px solid var(--border);
  font-size: 12px; font-weight: 600; color: var(--fg-muted);
  cursor: pointer;
}
.toggle.on { color: var(--accent); border-color: var(--accent); }

/* ---------- workspace ---------- */
.ws { display: grid; gap: 16px; grid-template-columns: 320px 1fr; min-height: calc(100vh - 130px); }
.ws-side {
  background: var(--bg-elev); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 16px;
  display: flex; flex-direction: column; gap: 12px;
}
.ws-side .drop {
  border: 2px dashed var(--border); border-radius: 14px;
  padding: 22px; text-align: center; color: var(--fg-muted);
  transition: var(--transition); cursor: pointer;
}
.ws-side .drop:hover { border-color: var(--accent); color: var(--accent); }
.tools { display: grid; gap: 8px; }
.ws-main {
  background: var(--bg-elev); border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  display: grid; grid-template-rows: auto 1fr auto;
  min-height: 0;
}
.ws-toolbar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  padding: 12px 14px; border-bottom: 1px solid var(--border);
}
.ws-editor {
  display: grid; grid-template-columns: 1fr 280px; gap: 0;
  min-height: 0;
}
.ws-editor textarea#transcript {
  border: 0; outline: 0; resize: none; background: transparent; color: var(--fg);
  padding: 20px; font-size: 15px; line-height: 1.7;
  border-right: 1px solid var(--border);
}
.ws-sidepanel {
  padding: 14px; background: var(--bg-soft);
  border-left: 1px solid var(--border); overflow: auto;
}
.ws-statusbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px; border-top: 1px solid var(--border);
  font-size: 12px; color: var(--fg-muted);
}

.spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--border); border-top-color: var(--accent); animation: sp 1s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }

.empty {
  display: grid; place-items: center; padding: 60px 24px; text-align: center; color: var(--fg-muted);
}
.empty .ico { font-size: 38px; margin-bottom: 10px; }

/* ---------- settings ---------- */
.settings { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.theme-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.theme-card {
  padding: 14px; border-radius: 14px; border: 1px solid var(--border);
  background: var(--bg-soft); cursor: pointer;
  transition: var(--transition);
}
.theme-card.active { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
.theme-swatches { display: flex; gap: 6px; margin-bottom: 10px; }
.theme-swatches span { display: inline-block; width: 22px; height: 22px; border-radius: 8px; border: 1px solid var(--border); }

/* ---------- modal ---------- */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: grid; place-items: center; z-index: 50; animation: fade .2s ease; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--bg-elev); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 24px; width: min(440px, 92vw);
  box-shadow: var(--shadow-2); animation: pop .25s ease;
}
.modal h3 { margin: 0 0 6px 0; }
.modal .row { display: flex; gap: 8px; margin: 14px 0; }
.modal .tab { flex: 1; padding: 8px; border-radius: 10px; border: 1px solid var(--border); background: transparent; color: var(--fg-muted); font-weight: 600; }
.modal .tab.active { background: var(--accent); color: #fff; border-color: transparent; }

/* ---------- responsive ---------- */
@media (max-width: 1024px) {
  .ws { grid-template-columns: 1fr; }
  .ws-editor { grid-template-columns: 1fr; }
  .ws-editor textarea#transcript { border-right: 0; border-bottom: 1px solid var(--border); }
}
@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { position: fixed; transform: translateX(-100%); transition: var(--transition); z-index: 40; width: 260px; }
  .sidebar.open { transform: none; }
  .main { padding: 18px; }
  .menu-btn { display: inline-flex !important; }
}
.menu-btn { display: none; }

/* ---------- misc ---------- */
.fade-in { animation: fade .35s ease; }
.badge-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); display: inline-block; }
.kbd { font: 12px var(--mono); background: var(--bg-soft); padding: 2px 6px; border-radius: 6px; border: 1px solid var(--border); }
.divider { height: 1px; background: var(--border); margin: 12px 0; }
.toast-host { position: fixed; right: 18px; bottom: 18px; display: grid; gap: 8px; z-index: 60; }
.toast { background: var(--bg-elev); border: 1px solid var(--border); padding: 12px 14px; border-radius: 12px; box-shadow: var(--shadow-2); max-width: 320px; font-size: 13px; }
</style>
</head>
<body>
<div class="app">
  <!-- sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="dot">T</div><span>Tscript AI</span></div>
    <div class="nav-section">Workspace</div>
    <button class="nav-btn" data-route="home"><i>🏠</i> Home</button>
    <button class="nav-btn" data-route="chat"><i>💬</i> AI Chat</button>
    <button class="nav-btn" data-route="transcribe"><i>📝</i> Transcription</button>
    <button class="nav-btn" data-route="youtube"><i>▶️</i> YouTube Transcription</button>
    <div class="nav-section">Account</div>
    <button class="nav-btn" data-route="settings"><i>⚙️</i> Settings</button>
    <div class="footer">
      <div>API: <span id="apiBaseLabel">https://tscriptai.onrender.com</span></div>
      <div>v2026.07 · <span id="connStatus"><span class="badge-dot"></span> connected</span></div>
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div style="display:flex;gap:10px;align-items:center">
        <button class="btn ghost icon menu-btn" id="menuBtn">☰</button>
        <div class="crumbs" id="crumbs">Home</div>
      </div>
      <div class="actions" id="userArea">
        <button class="btn" id="openAuth">Sign in</button>
      </div>
    </div>
    <div id="view"></div>
  </main>
</div>
<div class="toast-host" id="toastHost"></div>

<!-- auth modal -->
<div class="modal-bg" id="authModal" style="display:none">
  <div class="modal">
    <h3 id="authTitle">Sign in to Tscript AI</h3>
    <p style="color:var(--fg-muted);font-size:13px;margin:0 0 8px 0">Access your drafts, transcripts, and chat history across devices.</p>
    <div class="row">
      <button class="tab active" id="tabLogin">Sign in</button>
      <button class="tab" id="tabSignup">Create account</button>
    </div>
    <label style="font-size:12px;color:var(--fg-muted)">Email</label>
    <input type="email" id="authEmail" placeholder="you@example.com" />
    <label style="font-size:12px;color:var(--fg-muted);margin-top:10px;display:block">Password</label>
    <input type="password" id="authPassword" placeholder="At least 8 characters" />
    <div class="row" style="margin-top:14px">
      <button class="btn primary" id="authSubmit" style="flex:1">Continue</button>
      <button class="btn ghost" id="authCancel">Close</button>
    </div>
    <div class="divider"></div>
    <button class="btn" id="googleBtn" style="width:100%"><span style="color:#ea4335;font-weight:800">G</span>&nbsp; Continue with Google</button>
    <p id="authError" style="color:var(--error);font-size:12px;margin-top:10px"></p>
  </div>
</div>

<script>
/* =====================================================================
 * Tscript AI single-page app
 * ===================================================================== */
window.TSCRIPT = window.TSCRIPT || { config: { api_base: location.origin } };

(function () {
  'use strict';

  const Config = {
    api_base: 'https://tscriptai.onrender.com',
    themes: ['dark','light','pinkwhite','midnight','sepia'],
  };

  /* ---------- storage helpers ---------- */
  const Store = {
    get(key, def) { try { const v = localStorage.getItem('tscript:'+key); return v == null ? def : JSON.parse(v); } catch (e) { return def; } },
    set(key, val) { try { localStorage.setItem('tscript:'+key, JSON.stringify(val)); } catch (e) {} },
    rm(key) { try { localStorage.removeItem('tscript:'+key); } catch (e) {} }
  };

  const State = {
    user: Store.get('user', null),
    tokens: Store.get('tokens', null),
    theme: Store.get('theme', 'dark'),
    route: 'home',
    chat: { messages: [], web: false, imgGen: false, sessionId: null },
    transcribe: { text: '', filename: '' },
    youtube: { url: '', videoId: '', title: '', channel: '', text: '', loading: false },
    settings: { theme: Store.get('theme','dark'), notifications: true }
  };

  /* ---------- api ---------- */
  async function api(path, opts = {}) {
    const headers = Object.assign({}, opts.headers || {});
    if (State.tokens && State.tokens.access) headers['Authorization'] = 'Bearer ' + State.tokens.access;
    if (opts.body && !(opts.body instanceof FormData) && typeof opts.body !== 'string') {
      headers['Content-Type'] = 'application/json';
      opts.body = JSON.stringify(opts.body);
    }
    const url = Config.api_base + path;
    let resp;
    try {
      resp = await fetch(url, Object.assign({}, opts, { headers }));
    } catch (e) {
      throw new Error('Network error — could not reach ' + Config.api_base);
    }
    if (resp.status === 401 && State.tokens && State.tokens.refresh) {
      const r = await refreshTokens();
      if (r) {
        headers['Authorization'] = 'Bearer ' + r.access;
        resp = await fetch(url, Object.assign({}, opts, { headers }));
      }
    }
    const ct = resp.headers.get('content-type') || '';
    if (!resp.ok) {
      let detail = resp.status + ' ' + resp.statusText;
      try { if (ct.includes('application/json')) { const j = await resp.json(); detail = j.detail || JSON.stringify(j); } } catch (e) {}
      throw new Error(detail);
    }
    if (ct.includes('application/json')) return resp.json();
    return resp.text();
  }
  async function refreshTokens() {
    try {
      const r = await fetch(Config.api_base + '/auth/refresh', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ refresh_token: State.tokens.refresh })
      });
      if (!r.ok) { State.tokens = null; Store.rm('tokens'); State.user = null; Store.rm('user'); renderUserArea(); return null; }
      const data = await r.json();
      State.tokens = data; Store.set('tokens', data); return data;
    } catch (e) { return null; }
  }

  async function sendChat(retry) {
    const ta = document.getElementById('composerInput');
    const text = (ta.value || '').trim();
    if (!text && !retry) return;
    const lower = text.toLowerCase();
    const imageCmd = lower.startsWith('/image ');
    const searchCmd = lower.startsWith('/search ');
    if (!retry) {
      State.chat.messages.push({ role: 'user', content: text, web: State.chat.web, gen: State.chat.imgGen || imageCmd });
      renderMessages();
      ta.value = ''; Store.set('chatDraft','');
    } else {
      const last = State.chat.messages[State.chat.messages.length - 1];
      if (!last || last.role !== 'assistant') return;
      State.chat.messages.pop();
      renderMessages();
    }
    persistWorkspace('chat','messages',State.chat.messages);
    State.chat.messages.push({ role: 'assistant', content: 'Thinking…', web: State.chat.web, gen: State.chat.imgGen || imageCmd });
    renderMessages();
    try {
      let images = [];
      let sources = [];
      let reply = '';
      if (imageCmd || State.chat.imgGen) {
        const prompt = imageCmd ? text.slice(7) : text;
        try {
          const r = await api('/chat', { method: 'POST', body: { messages: [{ role: 'user', content: prompt }], generate_image: true } });
          reply = r.reply || 'Here is an image based on your request.';
          images = r.images || [];
        } catch (e) {
          // graceful fallback to image search
          try {
            const s = await api('/images/search?q=' + encodeURIComponent(prompt));
            images = (s.results || []).slice(0,4).map(x => ({ url: x.thumb || x.url, prompt }));
          } catch (e2) {}
          reply = reply || 'I found some related images for you.';
        }
      } else if (searchCmd) {
        const q = text.slice(8);
        const s = await api('/search?q=' + encodeURIComponent(q));
        sources = (s.results || []).map(r => ({ title: r.title, url: r.url, snippet: r.snippet }));
        reply = formatSearchResults(q, s.results || []);
      } else {
        const r = await api('/chat', { method: 'POST', body: { messages: State.chat.messages.slice(0,-2), web_search: State.chat.web || searchCmd } });
        reply = r.reply || '(no reply)';
      }
      State.chat.messages[State.chat.messages.length-1] = { role: 'assistant', content: reply, images, sources, web: State.chat.web || searchCmd };
      persistWorkspace('chat','messages',State.chat.messages);
      renderMessages();
    } catch (e) {
      State.chat.messages[State.chat.messages.length-1] = { role: 'assistant', content: '⚠ ' + e.message };
      renderMessages();
    }
  }
  function formatSearchResults(q, list) {
    if (!list.length) return `No live results available for "${q}". The reasoning engine can still attempt an answer from priors.`;
    return `Top web results for "${q}":\n\n` + list.slice(0,6).map((r,i) => `${i+1}. ${r.title}\n${r.snippet||''}\n${r.url}`).join('\n\n');

  async function runAI(mode) {

  function localClean(s) { return s.replace(/\bi\b/g,'I').replace(/ {2,}/g,' ').replace(/([.!?])\s*([a-z])/g,(m,a,b)=>a+' '+b.toUpperCase()).trim(); }
  function textToSrt(text) {
    const sentences = text.replace(/\n+/g,' ').split(/(?<=[.!?])\s+/);
    let out = '', i=1, t=0;
    for (const s of sentences) {
      const dur = Math.max(2, Math.round(s.split(/\s+/).length * 0.4));
      const a = fmtSrt(t); t += dur; const b = fmtSrt(t);
      out += `${i}\n${a} --> ${b}\n${s.trim()}\n\n`; i++;
    }
    return out.trim();
  }
  function fmtSrt(sec) { const h = String(Math.floor(sec/3600)).padStart(2,'0'); const m = String(Math.floor((sec%3600)/60)).padStart(2,'0'); const s = String(sec%60).padStart(2,'0'); return `${h}:${m}:${s},000`; }

            </div>
          </div>
          <div class="ws-statusbar"><span id="ytStatus">Ready</span><span id="ytRight">Tscript AI · YouTube</span></div>
        </section>
      </div>
    `;
    const urlInput = document.getElementById('ytUrl');
    const text = document.getElementById('ytText');
    text.value = State.youtube.text || '';
    updateYtCounts();
    urlInput.oninput = () => { State.youtube.url = urlInput.value; persistWorkspace('youtube','meta',State.youtube); };
    text.oninput = () => { State.youtube.text = text.value; updateYtCounts(); persistWorkspace('youtube','text',State.youtube.text); };
    document.getElementById('ytSubmit').onclick = submitYt;
    document.getElementById('ytReprocess').onclick = submitYt;
    document.getElementById('ytClear').onclick = () => { State.youtube = { url:'', videoId:'', title:'', channel:'', text:'', loading:false }; persistWorkspace('youtube','reset',true); renderYoutube(root); };
    document.getElementById('ytClean').onclick = () => ytAi('clean');
    document.getElementById('ytRewrite').onclick = () => ytAi('rewrite');
    document.getElementById('ytPunct').onclick = () => ytAi('clean');
    document.getElementById('ytCopy').onclick = () => { navigator.clipboard.writeText(text.value).then(()=>toast('Copied','success')); };
    document.getElementById('ytDownload').onclick = () => downloadFile((State.youtube.title||'youtube-transcript') + '.txt', text.value);
    document.getElementById('ytDownloadSrt').onclick = () => downloadFile((State.youtube.title||'youtube-transcript') + '.srt', textToSrt(text.value));
    if (State.youtube.loading) document.getElementById('ytState').textContent = 'processing';
  }
  function extractYtId(url) {
    try {
      const u = new URL(url);
      if (u.hostname.includes('youtu.be')) return u.pathname.slice(1).split('/')[0] || null;
      if (u.hostname.includes('youtube.com')) {
        const id = u.searchParams.get('v'); if (id) return id;
        const parts = u.pathname.split('/').filter(Boolean);
        if (['shorts','embed','live'].includes(parts[0]) && parts[1]) return parts[1];
      }
    } catch (e) {}
    const m = url && url.match(/[?&]v=([A-Za-z0-9_-]{6,})/); return m ? m[1] : null;
  }
  async function submitYt() {
    const url = (State.youtube.url || '').trim();
    const id = extractYtId(url);
    if (!id) { toast('Enter a valid YouTube URL','error'); return; }
    State.youtube.loading = true; State.youtube.videoId = id;
    persistWorkspace('youtube','meta',State.youtube);
    document.getElementById('ytState').textContent = 'processing';
    document.getElementById('ytStatus').textContent = 'Fetching audio…';
    try {
      const r = await api('/youtube/transcribe', { method: 'POST', body: { url } });
      State.youtube.videoId = r.video_id; State.youtube.title = r.metadata.title || id; State.youtube.channel = r.metadata.author_name || 'YouTube';
      State.youtube.text = r.transcript;
      persistWorkspace('youtube','text',State.youtube.text); persistWorkspace('youtube','meta',State.youtube);
      document.getElementById('ytMeta').style.display = 'block';
      document.getElementById('ytTitle').textContent = State.youtube.title;
      document.getElementById('ytChannel').textContent = State.youtube.channel;
      const ta = document.getElementById('ytText'); ta.value = State.youtube.text; updateYtCounts();
      document.getElementById('ytStatus').textContent = 'Transcribed · ' + new Date().toLocaleTimeString();
      toast('Transcript ready','success');
    } catch (e) { document.getElementById('ytStatus').textContent = 'Error'; toast(e.message,'error'); }
    finally { State.youtube.loading = false; persistWorkspace('youtube','meta',State.youtube); document.getElementById('ytState').textContent = 'idle'; }
  }
  async function ytAi(mode) {
    const t = document.getElementById('ytText');
    if (!t.value.trim()) { toast('Nothing to process','error'); return; }
    document.getElementById('ytStatus').textContent = 'AI working…';
    try {
      const r = await api('/text/clean', { method: 'POST', body: { text: t.value } });
      t.value = r.text || t.value;
      State.youtube.text = t.value; persistWorkspace('youtube','text',State.youtube.text); updateYtCounts();
      document.getElementById('ytStatus').textContent = 'Done · ' + new Date().toLocaleTimeString();
      toast('AI refinement complete','success');
    } catch (e) { document.getElementById('ytStatus').textContent = 'Error'; toast(e.message,'error'); }
  }
  function updateYtCounts() { const t = document.getElementById('ytText'); if (!t) return; const v = t.value||''; document.getElementById('ytWc').textContent = (v.match(/\S+/g)||[]).length; document.getElementById('ytCc').textContent = v.length; document.getElementById('ytSaved').textContent = new Date().toLocaleTimeString(); }

  /* ---------- settings ---------- */
  function renderSettings(root) {
    root.innerHTML = `
      <div class="section-title"><h2>Settings</h2><p>Personalize the workspace. Information about Tscript AI lives here.</p></div>
      <div class="settings">
        <div class="card">
          <h3>Appearance</h3>
          <p>Choose how Tscript AI looks across the app.</p>
          <div class="theme-grid" style="margin-top:12px">
            ${themeCard('dark','Midnight',['#0b1219','#111a23','#00c8e0'])}
            ${themeCard('light','Daylight',['#f6f8fb','#ffffff','#0070f3'])}
            ${themeCard('pinkwhite','Pink & White',['#ffeaf3','#ffffff','#ec4899'])}
            ${themeCard('midnight','Ink',['#050810','#0c111b','#38bdf8'])}
            ${themeCard('sepia','Sepia',['#f4ecd8','#fbf6e9','#8b5a2b'])}
          </div>
        </div>
        <div class="card">
          <h3>Account</h3>
          <p id="accountInfo">${State.user ? `Signed in as <strong>${escapeHtml(State.user.email)}</strong>` : 'You are browsing as a guest. Drafts are saved locally to this device.'}</p>
          ${State.user ? `<div style="display:flex;gap:8px;margin-top:10px"><button class="btn" id="logoutBtn">Sign out</button></div>` : `<div style="display:flex;gap:8px;margin-top:10px"><button class="btn primary" id="signinNow">Sign in</button></div>`}
        </div>
        <div class="card">
          <h3>About Tscript AI</h3>
          <p><em>"A precise instrument for text."</em></p>
          <p>© 2026 Tscript AI · Built by Bright Dumashie.</p>
          <p style="margin-top:8px">Tscript AI is a modern workspace for reasoning, transcription, grammar refinement, and content editing. It accepts PDF, DOCX, PPTX, XLSX, images, audio, and YouTube URLs. Drafts persist locally and are mirrored to your account when you sign in.</p>
        </div>
        <div class="card">
          <h3>Workspace state</h3>
          <p>Your current draft and chat history stay safe across refreshes.</p>
          <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
            <button class="btn" id="clearLocal">Clear local drafts</button>
            <button class="btn" id="resetAll">Reset workspace</button>
          </div>
        </div>
        <div class="card">
          <h3>Legal & regulatory</h3>
          <p>Tscript AI is provided as-is. You retain ownership of any content you upload or generate. Do not upload content you do not have the right to process.</p>
          <p>Service availability, accuracy, and uptime are best-effort. Critical workflows should keep local copies.</p>
        </div>
        <div class="card">
          <h3>Application information</h3>
          <p>Version: 2026.07 · Build channel: stable</p>
          <p>Frontend: single-page application · Backend: FastAPI on Render</p>
          <p>Capabilities: <span class="tag" id="capChat">chat</span> <span class="tag" id="capYT">youtube</span> <span class="tag" id="capImg">image</span> <span class="tag" id="capSearch">search</span></p>
        </div>
      </div>
    `;
    document.querySelectorAll('.theme-card').forEach(c => c.onclick = () => applyTheme(c.dataset.theme));
    const cap = Store.get('capabilities', {});
    if (cap.ai_chat_enabled) document.getElementById('capChat').style.borderColor = 'var(--success)';
    if (cap.whisper_enabled) document.getElementById('capYT').style.borderColor = 'var(--success)';
    if (cap.image_gen_enabled) document.getElementById('capImg').style.borderColor = 'var(--success)';
    if (cap.web_search_enabled) document.getElementById('capSearch').style.borderColor = 'var(--success)';
    const lo = document.getElementById('logoutBtn'); if (lo) lo.onclick = doLogout;
    const sn = document.getElementById('signinNow'); if (sn) sn.onclick = () => openAuth();
    document.getElementById('clearLocal').onclick = () => { ['chat','transcribe','youtube'].forEach(k => Store.rm(k+'Draft')); persistWorkspace('chat','messages',[]); persistWorkspace('chat','meta',State.chat); persistWorkspace('transcribe','text',''); persistWorkspace('youtube','text',''); toast('Local drafts cleared','success'); };
    document.getElementById('resetAll').onclick = () => { Object.keys(localStorage).filter(k=>k.startsWith('tscript:')).forEach(k=>localStorage.removeItem(k)); toast('Workspace reset','success'); setTimeout(()=>location.reload(),400); };
  }
  function themeCard(key, label, sw) {
    return `<div class="theme-card ${State.settings.theme===key?'active':''}" data-theme="${key}">
      <div class="theme-swatches">${sw.map(c => `<span style="background:${c}"></span>`).join('')}</div>
      <div style="font-weight:700;font-size:13px">${label}</div>
      <div style="color:var(--fg-muted);font-size:11px">${key}</div>
    </div>`;
  }

  /* ---------- persistence ---------- */
  function persistWorkspace(workspace, key, value) {
    Store.set('ws:'+workspace+':'+key, value);
    if (State.user) {
      api('/drafts/save', { method: 'POST', body: { workspace, key, value } }).catch(() => {});
    }
  }

  /* ---------- auth ---------- */
  function renderUserArea() {
    const area = document.getElementById('userArea');
    if (State.user) {
      const initials = (State.user.display_name || State.user.email || '?').slice(0,1).toUpperCase();
      area.innerHTML = `
        <div class="user-chip">
          ${State.user.avatar_url ? `<img src="${State.user.avatar_url}" alt="">` : `<div style="width:26px;height:26px;border-radius:999px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700">${initials}</div>`}
          <span class="name">${escapeHtml(State.user.display_name || State.user.email)}</span>
          <button class="btn ghost icon" id="settingsBtn" title="Settings">⚙️</button>
        </div>`;
      document.getElementById('settingsBtn').onclick = () => go('settings');
    } else {
      area.innerHTML = `<button class="btn primary" id="openAuth">Sign in</button><button class="btn" data-go="settings">Settings</button>`;
      area.querySelector('#openAuth').onclick = openAuth;
      area.querySelector('[data-go="settings"]').onclick = () => go('settings');
    }
  }
  function openAuth(initialTab) {
    document.getElementById('authModal').style.display = 'grid';
    setAuthTab(initialTab || 'login');
    document.getElementById('authEmail').value = '';
    document.getElementById('authPassword').value = '';
    document.getElementById('authError').textContent = '';
  }
  function closeAuth() { document.getElementById('authModal').style.display = 'none'; }
  function setAuthTab(tab) {
    document.getElementById('tabLogin').classList.toggle('active', tab==='login');
    document.getElementById('tabSignup').classList.toggle('active', tab==='signup');
    document.getElementById('authTitle').textContent = tab==='signup' ? 'Create your Tscript AI account' : 'Sign in to Tscript AI';
    document.getElementById('authSubmit').textContent = tab==='signup' ? 'Create account' : 'Sign in';
    document.getElementById('authSubmit').dataset.tab = tab;
  }
  async function submitAuth() {
    const tab = document.getElementById('authSubmit').dataset.tab || 'login';
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;
    if (!email || !password) { document.getElementById('authError').textContent = 'Email and password required.'; return; }
    try {
      const r = await api('/auth/' + (tab === 'signup' ? 'signup' : 'login'), { method: 'POST', body: { email, password } });
      State.tokens = { access: r.access, refresh: r.refresh, expires_in: r.expires_in };
      State.user = r.user; Store.set('tokens', State.tokens); Store.set('user', State.user);
      closeAuth(); renderUserArea(); toast('Welcome to Tscript AI','success');
    } catch (e) { document.getElementById('authError').textContent = e.message; }
  }
  async function doLogout() {
    try { if (State.tokens) await api('/auth/logout', { method: 'POST', body: { refresh_token: State.tokens.refresh } }); }
    catch (e) {}
    State.user = null; State.tokens = null; Store.rm('user'); Store.rm('tokens');
    renderUserArea(); toast('Signed out','success');
  }

  /* ---------- bootstrap ---------- */
  function loadDrafts() {
    const cm = Store.get('ws:chat:messages', []);
    const cwm = Store.get('ws:chat:meta', null);
    if (Array.isArray(cm)) State.chat.messages = cm;
    if (cwm && typeof cwm === 'object') Object.assign(State.chat, cwm);
    const tr = Store.get('ws:transcribe:text', '');
    if (typeof tr === 'string') State.transcribe.text = tr;
    const ym = Store.get('ws:youtube:meta', null);
    if (ym && typeof ym === 'object') Object.assign(State.youtube, ym);
    const yt = Store.get('ws:youtube:text', '');
    if (typeof yt === 'string') State.youtube.text = yt;
  }

  async function init() {
    // nav
    document.querySelectorAll('.nav-btn').forEach(b => b.onclick = () => go(b.dataset.route));
    document.getElementById('menuBtn').onclick = () => document.getElementById('sidebar').classList.toggle('open');

    // auth modal
    document.getElementById('openAuth').onclick = () => openAuth();
    document.getElementById('authCancel').onclick = closeAuth;
    document.getElementById('tabLogin').onclick = () => setAuthTab('login');
    document.getElementById('tabSignup').onclick = () => setAuthTab('signup');
    document.getElementById('authSubmit').onclick = submitAuth;
    document.getElementById('googleBtn').onclick = async () => {
      try {
        const r = await api('/auth/google/start');
        if (r.redirect) location.href = r.redirect;
      } catch (e) { toast(e.message, 'error'); }
    };
    document.getElementById('authModal').addEventListener('click', e => { if (e.target.id==='authModal') closeAuth(); });

    // config
    try {
      const cfg = await fetch(Config.api_base + '/config').then(r => r.json());
      Store.set('capabilities', cfg);
      window.TSCRIPT.config = cfg;
      document.getElementById('apiBaseLabel').textContent = cfg.api_base || Config.api_base;
    } catch (e) {
      document.getElementById('connStatus').innerHTML = '<span style="color:var(--warn)">⚠ backend unreachable</span>';
    }

    loadDrafts();
    applyTheme(State.settings.theme);
    renderUserArea();
    const last = Store.get('lastRoute', 'home');
    go(last);
  }
  document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
